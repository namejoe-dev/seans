<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kechki seans</title>
<style>
:root{--ink:#f3f0ff;--mute:#aaa6cc;--line:rgba(255,255,255,.14);--c:#6ea8ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;background:color-mix(in srgb,var(--c) 16%,#14122b);transition:background 1s;-webkit-text-size-adjust:100%;overflow-x:hidden}
.app{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px}
#clock{font:600 34px ui-serif,Georgia,serif;font-variant-numeric:tabular-nums;flex:1}
.hb{height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:600}
.hint{margin:2px 0 0;font-size:13px;color:var(--mute)}
main{flex:1;display:flex;flex-direction:column;position:relative}
.sl{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;animation:in .5s ease-out}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
.k{margin:14px 0 0;color:var(--mute);font-size:15px}
h1{margin:2px 0 10px;font:600 clamp(30px,8vw,46px)/1.1 ui-serif,Georgia,serif}
.ring{position:relative;width:min(62vw,250px);aspect-ratio:1}
.ring svg{width:100%;height:100%}
.tr{fill:none;stroke:var(--line);stroke-width:5}
.pg{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1s linear}
.scene{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(60px,18vw,92px)}
.scene span{display:block;animation:bob 2.4s ease-in-out infinite}
.a-ring span{animation:rg 1.6s infinite}.a-breathe span{animation:br 8s ease-in-out infinite}.a-pulse span{animation:pl 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes rg{0%,70%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-14deg)}20%,40%,60%{transform:rotate(14deg)}}
@keyframes br{0%,100%{transform:scale(.65)}50%{transform:scale(1.15)}}
@keyframes pl{50%{transform:scale(1.13)}}
.z{position:absolute;left:62%;top:30%;font:700 26px ui-serif,serif;color:var(--c);opacity:0;animation:zz 3s infinite}
.z:nth-of-type(2){animation-delay:1s}.z:nth-of-type(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(44px,-76px) scale(1.4)}}
.tm{font:600 clamp(40px,12vw,60px)/1 ui-serif,Georgia,serif;font-variant-numeric:tabular-nums;margin-top:12px;color:var(--c)}
.lb{color:var(--mute);font-size:15px;min-height:22px}
.tip{max-width:34ch;margin:12px 0;color:var(--ink);opacity:.9}
.go{height:52px;padding:0 28px;border:0;border-radius:26px;background:var(--c);color:#14122b;font-weight:700;margin-top:6px}
.pn{position:absolute;top:44%;width:44px;height:56px;border:0;background:none;font-size:34px;color:var(--mute)}
.pn.l{left:-8px}.pn.r{right:-8px}
.golf{position:relative;width:100%;max-width:420px;height:64px;border-radius:32px;background:color-mix(in srgb,var(--c) 28%,#14122b);margin:6px 0}
.hole{position:absolute;left:72%;top:50%;width:26px;height:12px;margin:-4px 0 0 -13px;border-radius:50%;background:#0a0918}
.hole::before{content:"⛳";position:absolute;left:4px;top:-30px;font-size:26px}
.ball{position:absolute;left:6%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;transition:left .9s cubic-bezier(.15,.7,.3,1)}
.pw{width:100%;max-width:420px;height:12px;border-radius:9px;background:var(--line);overflow:hidden;position:relative;margin:10px 0}
.pw i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c)}
.pw::after{content:"";position:absolute;left:69%;width:12%;top:0;bottom:0;border:2px solid #fff;border-radius:9px;opacity:.7}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;min-width:64px;padding:8px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);text-align:center;font-size:12px;color:var(--mute)}
.ch b{display:block;font-size:20px;font-weight:400}
.ch.past{opacity:.45}.ch.past b::after{content:"✓";font-size:13px;margin-left:2px;color:var(--ink)}
.ch.sel{border-color:var(--ink);color:var(--ink)}
.ch.now{box-shadow:0 0 0 2px var(--c);color:var(--ink)}
dialog{border:0;border-radius:22px;padding:0;width:min(520px,calc(100% - 24px));background:#1d1a40;color:var(--ink)}
dialog::backdrop{background:rgba(5,4,20,.65)}
.qb{position:relative;padding:20px;overflow:hidden}
.qb h2{margin:0 0 4px;font:600 22px ui-serif,Georgia,serif}
#qo{display:grid;gap:10px;margin:14px 0}
#qo button{min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);text-align:left}
#qo button.ok{background:#1f8f6a;border-color:#3ee0a8}#qo button.bad{background:#a23a52;border-color:#ff7b95;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#qf{min-height:48px;color:#ffd98a}
.row{display:flex;gap:10px}.row button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:600}
.row .go{margin:0;border-radius:14px;background:#ffc857;color:#14122b}
.bp{position:absolute;pointer-events:none;font-size:24px;animation:bp 1.1s ease-out forwards;z-index:5}
@keyframes bp{to{transform:translate(var(--dx),var(--dy)) rotate(240deg);opacity:0}}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div id="clock">--:--</div>
    <button class="hb" id="live" hidden>● Hozirgi</button>
    <button class="hb" id="qz">🧠 Test</button>
    <button class="hb" id="snd" aria-label="Ovoz">🔊</button>
  </header>
  <p class="hint" id="hint">Ovoz yoqilishi uchun ekranga bir marta teging.</p>
  <main id="slide"></main>
  <nav class="strip" id="strip"></nav>
</div>

<dialog id="qd"><div class="qb">
  <h2>Mnemonika testi</h2><div class="lb" id="qn"></div>
  <p id="qq" style="font-size:18px;margin:10px 0"></p>
  <div id="qo"></div><div id="qf"></div>
  <div class="row"><button id="qx">Yopish</button><button class="go" id="qnext" hidden>Keyingi</button></div>
</div></dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const sec = t => { const [h,m] = t.split(":").map(Number); return (h*60+m)*60; };
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = s => s>=3600 ? `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}` : `${pad(Math.floor(s/60))}:${pad(s%60)}`;

/* ---------- slide types and schedule (19:00-23:00) ---------- */
const TY = {
  study:{c:"#6ea8ff",e:"💻",a:"bob"}, read:{c:"#8ad4ff",e:"📖",a:"bob"}, write:{c:"#ff8fb1",e:"✍️",a:"bob"},
  call:{c:"#5be0b3",e:"📞",a:"ring"}, golf:{c:"#b6e35a",e:"🏌️",a:"bob"}, nap:{c:"#b69cff",e:"😴",a:"bob"},
  air:{c:"#4fd1d9",e:"🌿",a:"breathe"}, quiz:{c:"#ffc857",e:"🧠",a:"pulse"}
};
const D = [
 ["19:00","19:50","study","CSS dars","Yangi mavzu. Telefon boshqa xonada, faqat bitta mavzu."],
 ["19:50","19:57","call","Telda gaplashish","Yaqinlaring bilan gaplash. Taymer tugasa, xayrlash."],
 ["19:57","20:40","study","Kod yozish mashqi","Kitobga qaramay o'zing yoz. Xatoni o'zing top."],
 ["20:40","20:48","golf","Golf o'yini","Quvvat chizig'i oq ramkaga kelganda Urish bosing."],
 ["20:48","21:35","study","Kichik loyiha","Portfolio sahifangni yasashda davom et."],
 ["21:35","21:45","nap","Uxlab olish","Ko'zingni yum. Ovoz 10 daqiqadan keyin ohista uyg'otadi."],
 ["21:45","22:25","read","Kitob o'qish","Har sahifadan keyin bir gapda xulosa yoz."],
 ["22:25","22:32","quiz","Mnemonika testi","Bugun o'rganganingni tekshir."],
 ["22:32","22:37","air","Havo almashtirish","Derazani och. Chuqur nafas ol."],
 ["22:37","23:00","write","Konspekt yozish","Bugun nimani o'rgandingni o'z so'zing bilan yoz."]
];
const B = D.map(([s,e,t,n,tip]) => ({s,e,t,n,tip,a:sec(s),b:sec(e)}));

/* ---------- storage ---------- */
let best = {quiz:0,golf:0};
try { best = Object.assign(best, JSON.parse(localStorage.getItem("ks.best"))); } catch(e){}
const saveBest = () => { try { localStorage.setItem("ks.best", JSON.stringify(best)); } catch(e){} };

/* ---------- sound (WebAudio, no files needed) ---------- */
let AC = null, mute = false;
function ac(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); return AC; }
function tone(f,t=0,d=.2,type="sine",v=.15){
  if (mute) return;
  try { const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);
    g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.05); } catch(e){}
}
const S = {
  chime:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.14,.5)),
  soft:()=>[392,330,262].forEach((f,i)=>tone(f,i*.45,1.1,"sine",.12)),
  ok:()=>[660,880].forEach((f,i)=>tone(f,i*.1,.25)),
  bad:()=>tone(160,0,.35,"sawtooth",.1),
  hit:()=>tone(320,0,.08,"square",.1),
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.3))
};
document.addEventListener("pointerdown", () => {
  try { ac(); $("#hint").hidden = true; navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); } catch(e){}
}, {once:true});
$("#snd").onclick = () => { mute = !mute; $("#snd").textContent = mute ? "🔇" : "🔊"; };

/* ---------- confetti ---------- */
function burst(el, chars){
  const cs = [...chars];
  for (let i=0;i<14;i++){
    const s = document.createElement("span"); s.className = "bp"; s.textContent = cs[i%cs.length];
    s.style.cssText = `--dx:${(Math.random()-.5)*320}px;--dy:${-60-Math.random()*220}px;left:50%;top:65%`;
    el.append(s); setTimeout(() => s.remove(), 1200);
  }
}

/* ---------- slides ---------- */
let idx = 0, follow = true;
const nowSec = () => { const n = new Date(); return n.getHours()*3600+n.getMinutes()*60+n.getSeconds(); };
const curIdx = s => B.findIndex(b => s>=b.a && s<b.b);
const wantIdx = s => { const c = curIdx(s); return c>=0 ? c : (s<B[0].a ? 0 : B.length-1); };

function show(snd){
  const b = B[idx], T = TY[b.t];
  document.body.style.setProperty("--c", T.c);
  const extra = b.t==="golf"
    ? `<div class="golf" id="g"><div class="hole"></div><div class="ball" id="ball"></div></div><div class="pw"><i id="pw"></i></div>
       <button class="go" id="hit">Urish</button><p class="lb" id="gm">Eng yaxshi: ${best.golf} ta zarba</p>`
    : b.t==="quiz" ? `<button class="go" id="qs">Testni boshlash</button>` : "";
  $("#slide").innerHTML = `<section class="sl">
    <p class="k">${b.s} – ${b.e}</p><h1>${b.n}</h1>
    <div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/>
      <circle class="pg" id="pg" cx="60" cy="60" r="54" transform="rotate(-90 60 60)"/></svg>
      <div class="scene a-${T.a}"><span>${T.e}</span></div>${b.t==="nap" ? "<b class='z'>z</b><b class='z'>z</b><b class='z'>Z</b>" : ""}</div>
    <div class="tm" id="tm">--:--</div><div class="lb" id="lb"></div>
    <p class="tip">${b.tip}</p>${extra}</section>
    <button class="pn l" id="pv" aria-label="Oldingi">‹</button><button class="pn r" id="nx" aria-label="Keyingi">›</button>`;
  $("#pv").onclick = () => go(-1); $("#nx").onclick = () => go(1);
  if (b.t==="golf") golf();
  if (b.t==="quiz") $("#qs").onclick = openQ;
  if (snd) (b.t==="nap" ? S.soft : S.chime)();
  document.querySelectorAll(".ch").forEach((c,i) => c.classList.toggle("sel", i===idx));
  $("#live").hidden = follow;
  tick();
}
function go(d){ const n = idx+d; if (n<0||n>=B.length) return; follow = false; idx = n; show(false); }
$("#live").onclick = () => { follow = true; idx = wantIdx(nowSec()); show(false); };

$("#strip").innerHTML = B.map((b,i) => `<button class="ch" data-i="${i}"><b>${TY[b.t].e}</b>${b.s}</button>`).join("");
$("#strip").addEventListener("click", e => { const c = e.target.closest(".ch"); if (c){ follow = false; idx = +c.dataset.i; show(false); } });
let x0 = null;
$("#slide").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
$("#slide").addEventListener("touchend", e => { if (x0===null) return; const dx = e.changedTouches[0].clientX-x0; x0 = null; if (Math.abs(dx)>60) go(dx<0?1:-1); });

function tick(){
  const s = nowSec(), n = new Date(), c = curIdx(s), b = B[idx];
  $("#clock").textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  if (follow){ const w = wantIdx(s); if (w!==idx){ idx = w; show(c>=0); return; } }
  let frac, txt, lbl;
  if (s >= b.b){ frac = 1; txt = "✓"; lbl = s>=B[B.length-1].b ? "Seans tugadi. Barakalla!" : "tugagan"; }
  else if (s >= b.a){ frac = (s-b.a)/(b.b-b.a); txt = fmt(b.b-s); lbl = "qoldi"; }
  else { frac = 0; txt = fmt(b.a-s); lbl = "boshlanishiga"; }
  $("#pg").style.strokeDashoffset = 339.3*(1-frac);
  $("#tm").textContent = txt; $("#lb").textContent = (b.t==="air" && idx===c) ? (Math.floor(s/4)%2 ? "Nafasni chiqar..." : "Nafas ol...") : lbl;
  document.querySelectorAll(".ch").forEach((el,i) => {
    el.classList.toggle("now", i===c);
    el.classList.toggle("past", B[i].b <= s);
  });
}

/* ---------- golf mini-game ---------- */
function golf(){
  const pw = $("#pw"), ball = $("#ball"); let p = 0, busy = false, shots = 0; const t0 = performance.now();
  const loop = t => { if (!pw.isConnected) return; if (!busy){ p = (Math.sin((t-t0)/380-Math.PI/2)+1)/2; pw.style.width = p*100+"%"; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  $("#hit").onclick = () => {
    if (busy) return; busy = true; shots++; S.hit(); ball.style.left = (6+p*88)+"%";
    setTimeout(() => {
      const win = Math.abs(p-.75) < .06;
      if (win){ S.win(); burst($("#slide"),"⛳🎉✨"); $("#gm").textContent = `Teshikka tushdi! ${shots} ta zarbada`;
        if (!best.golf || shots<best.golf){ best.golf = shots; saveBest(); } shots = 0; }
      else { S.bad(); $("#gm").textContent = p<.75 ? "Kuchsiz urdingiz, yana urining" : "Juda qattiq, yana urining"; }
      setTimeout(() => { ball.style.transition = "none"; ball.style.left = "6%"; void ball.offsetWidth; ball.style.transition = ""; busy = false; }, 1100);
    }, 950);
  };
}

/* ---------- mnemonic quiz ---------- */
const QS = [
 ["Quti modeli ichkaridan tashqariga qanday?",["Content, Padding, Border, Margin","Margin, Border, Padding, Content","Content, Border, Padding, Margin"],0,"Choy-Pishiriq-Bolalarga-Mazali: C, P, B, M."],
 ["margin: 10px 20px 30px 40px. Tartib qanday?",["Top, Right, Bottom, Left","Top, Bottom, Left, Right","Left, Top, Right, Bottom"],0,"TRouBLe: Top, Right, Bottom, Left (soat strelkasi bo'ylab)."],
 ["Qaysi selektor eng kuchli?",["div","#menu",".card"],1,"Kichikdan kattaga: tag < class < id < inline."],
 ["Flex'da asosiy o'q bo'ylab joylash qaysi?",["justify-content","align-items","flex-wrap"],0,"Justify = bosh o'q. Align = ko'ndalang o'q."],
 ["rem nimaga nisbatan hisoblanadi?",["html (ildiz) shrifti","Ota element shrifti","Ekran kengligi"],0,"rem = Root EM. Root, ya'ni ildiz."],
 ["Ekranga mixlab qo'yadigan position qaysi?",["fixed","relative","static"],0,"fixed = mixlangan: ekranda qotib turadi."],
 ["Havola yaratadigan teg qaysi?",["<a>","<link>","<p>"],0,"a = anchor, langar: boshqa sahifaga bog'laydi."],
 ["Navigatsiya uchun semantik teg qaysi?",["<nav>","<div>","<menu>"],0,"nav = navigatsiya: yo'l ko'rsatuvchi."],
 ["box-sizing: border-box nimani o'zgartiradi?",["width ichiga padding va border kiradi","Faqat margin o'chadi","Matn rangi o'zgaradi"],0,"Border-box: chegara kenglikka kiradi, quti kengaymaydi."],
 ["z-index qaysi elementlarda ishlaydi?",["position berilgan elementlarda","Faqat rasmlarda","Faqat div'da"],0,"z-index = qavat. Position bo'lsa, qavatga chiqadi."]
];
let Q = [], qi = 0, score = 0;
const qd = $("#qd");
function openQ(){ Q = shuffle([...QS]); qi = 0; score = 0; qd.showModal(); ask(); }
function ask(){
  const q = Q[qi];
  $("#qn").textContent = `Savol ${qi+1} / ${Q.length}`; $("#qq").textContent = q[0]; $("#qf").textContent = ""; $("#qnext").hidden = true;
  $("#qo").innerHTML = "";
  shuffle(q[1].map((t,i) => ({t, ok:i===q[2]}))).forEach(o => {
    const b = document.createElement("button"); b.textContent = o.t; b.onclick = () => pick(b,o.ok,q); $("#qo").append(b);
  });
}
function pick(b, ok, q){
  const btns = [...$("#qo").children]; btns.forEach(x => x.disabled = true);
  b.classList.add(ok ? "ok" : "bad");
  if (ok){ score++; S.ok(); burst(qd.firstElementChild,"✨🎉⭐"); }
  else { S.bad(); btns.find(x => x.textContent===q[1][q[2]]).classList.add("ok"); }
  $("#qf").textContent = "🧠 " + q[3];
  $("#qnext").hidden = false; $("#qnext").textContent = qi<Q.length-1 ? "Keyingi" : "Natija";
}
$("#qnext").onclick = () => {
  if (qi < Q.length-1){ qi++; ask(); return; }
  $("#qo").innerHTML = ""; $("#qq").textContent = `Natija: ${score} / ${Q.length}`; $("#qn").textContent = "Test tugadi";
  if (score > best.quiz){ best.quiz = score; saveBest(); }
  $("#qf").textContent = `Eng yaxshi natija: ${best.quiz} / ${Q.length}`; $("#qnext").hidden = true;
  if (score >= 8){ S.win(); burst(qd.firstElementChild,"🏆🎉✨"); }
};
$("#qx").onclick = () => qd.close();
$("#qz").onclick = openQ;

/* ---------- start ---------- */
idx = wantIdx(nowSec()); show(false);
setInterval(tick, 1000);
</script>
</body>
</html>
